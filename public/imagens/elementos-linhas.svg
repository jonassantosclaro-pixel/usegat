  <!-- Pepperonis (Circles) -->
  <!-- Pepperoni 1 (Top Center) -->
  <circle cx="50" cy="30" r="9" fill="none" stroke="currentColor" stroke-width="3.5" />
  
  <!-- Pepperoni 2 (Bottom Left) -->
  <circle cx="34" cy="48" r="8" fill="none" stroke="currentColor" stroke-width="3.5" />

  <!-- Pepperoni 3 (Bottom Right) -->
  <circle cx="66" cy="48" r="8.5" fill="none" stroke="currentColor" stroke-width="3.5" />

  <!-- Green Basil Leaf -->
  <g transform="translate(50, 48) rotate(-15)">
    <path d="M 0,-10 C 6,-10 10,-5 10,0 C 10,5 5,10 0,14 C -5,10 -10,5 -10,0 C -10,-5 -6,-10 0,-10 Z" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linejoin="round" />
    <path d="M 0,-10 L 0,10" fill="none" stroke="currentColor" stroke-width="3" />
    <path d="M 0,-4 Q 4,-6 6,-8" fill="none" stroke="currentColor" stroke-width="2" />
    <path d="M 0,1 Q -4,-1 -6,-3" fill="none" stroke="currentColor" stroke-width="2" />
  </g>

  <!-- Black Olives (Double Circles/Contours) -->
  <!-- Olive 1 -->
  <circle cx="36" cy="32" r="3.5" fill="none" stroke="currentColor" stroke-width="3.5" />
  <!-- Olive 2 -->
  <circle cx="62" cy="33" r="3.5" fill="none" stroke="currentColor" stroke-width="3.5" />
  <!-- Olive 3 -->
  <circle cx="50" cy="68" r="3.5" fill="none" stroke="currentColor" stroke-width="3.5" />
