<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Pizza Slice Crust (Golden Back) -->
  <path d="M 50,5 Q 53,5 57,6 Q 63,8 70,12 C 78,17 84,23 90,32 C 94,38 95,44 95,48 C 95,50 93,52 82,54 L 50,90 L 18,54 C 7,52 5,50 5,48 C 5,44 6,38 10,32 C 16,23 22,17 30,12 Q 37,8 43,6 Q 47,5 50,5 Z" fill="#E67E22" stroke="#2C3E50" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Outer Crust Detail -->
  <path d="M 50,8 Q 65,11 78,19 C 85,24 89,30 91,37" fill="none" stroke="#D35400" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 50,8 Q 35,11 22,19 C 15,24 11,30 9,37" fill="none" stroke="#D35400" stroke-width="2.5" stroke-linecap="round" />

  <!-- Inner Cheese Cover -->
  <path d="M 50,14 C 61,16 71,21 78,28 C 84,34 86,41 86,44 L 50,84 L 14,44 C 14,41 16,34 22,28 C 29,21 39,16 50,14 Z" fill="#F1C40F" stroke="#2C3E50" stroke-width="3" stroke-linejoin="round" />
  
  <!-- Cheese Highlights and Melts -->
  <path d="M 35,27 C 42,20 58,20 65,27 C 70,32 72,40 70,47 L 50,71 L 30,47 C 28,40 30,32 35,27 Z" fill="#F9D73C" />
  
  <!-- Red Tomato Sauce layers peeking -->
  <path d="M 46,12 C 48,12 52,12 54,12 C 55,14 55,16 54,17 C 52,18 48,18 46,17 C 45,16 45,14 46,12 Z" fill="#E74C3C" />
  <path d="M 12,41 C 12,39 15,36 17,37 C 19,38 19,41 18,43 C 17,45 13,44 12,41 Z" fill="#E74C3C" />
  <path d="M 88,41 C 88,39 85,36 83,37 C 81,38 81,41 82,43 C 83,45 87,44 88,41 Z" fill="#E74C3C" />

  <!-- Pepperonis (Red Circles with darker borders and tiny highlights) -->
  <!-- Pepperoni 1 (Top Center) -->
  <g>
    <circle cx="50" cy="30" r="9" fill="#E74C3C" stroke="#2C3E50" stroke-width="3" />
    <circle cx="48" cy="28" r="6" fill="#C0392B" />
    <circle cx="53" cy="27" r="1.5" fill="#FFFFFF" opacity="0.6" />
    <!-- Specks -->
    <circle cx="46" cy="32" r="0.7" fill="#F1C40F" />
    <circle cx="51" cy="33" r="0.7" fill="#F1C40F" />
  </g>
  
  <!-- Pepperoni 2 (Bottom Left) -->
  <g>
    <circle cx="34" cy="48" r="8" fill="#E74C3C" stroke="#2C3E50" stroke-width="3" />
    <circle cx="32" cy="46" r="5.5" fill="#C0392B" />
    <circle cx="36" cy="45" r="1.2" fill="#FFFFFF" opacity="0.6" />
    <circle cx="30" cy="50" r="0.7" fill="#F1C40F" />
  </g>

  <!-- Pepperoni 3 (Bottom Right) -->
  <g>
    <circle cx="66" cy="48" r="8.5" fill="#E74C3C" stroke="#2C3E50" stroke-width="3" />
    <circle cx="64" cy="46" r="6" fill="#C0392B" />
    <circle cx="68" cy="45" r="1.3" fill="#FFFFFF" opacity="0.6" />
    <circle cx="63" cy="50" r="0.7" fill="#F1C40F" />
  </g>

  <!-- Green Basil Leaf -->
  <g transform="translate(50, 48) rotate(-15)">
    <path d="M 0,-10 C 6,-10 10,-5 10,0 C 10,5 5,10 0,14 C -5,10 -10,5 -10,0 C -10,-5 -6,-10 0,-10 Z" fill="#2ECC71" stroke="#2C3E50" stroke-width="2.5" stroke-linejoin="round" />
    <path d="M 0,-10 L 0,10" fill="none" stroke="#27AE60" stroke-width="2" />
    <path d="M 0,-4 Q 4,-6 6,-8" fill="none" stroke="#27AE60" stroke-width="1.5" />
    <path d="M 0,1 Q -4,-1 -6,-3" fill="none" stroke="#27AE60" stroke-width="1.5" />
  </g>

  <!-- Black Olives -->
  <!-- Olive 1 -->
  <g transform="translate(36, 32)">
    <ellipse cx="0" cy="0" rx="4.5" ry="3.5" fill="#34495E" stroke="#2C3E50" stroke-width="2.5" />
    <ellipse cx="0" cy="0" rx="1.8" ry="1.2" fill="#F1C40F" />
  </g>
  <!-- Olive 2 -->
  <g transform="translate(62, 33)">
    <ellipse cx="0" cy="0" rx="4" ry="4" fill="#34495E" stroke="#2C3E50" stroke-width="2.5" />
    <circle cx="0" cy="0" r="1.5" fill="#F1C40F" />
  </g>
  <!-- Olive 3 -->
  <g transform="translate(50, 68) rotate(35)">
    <ellipse cx="0" cy="0" rx="4" ry="3" fill="#34495E" stroke="#2C3E50" stroke-width="2.5" />
    <ellipse cx="0" cy="0" rx="1.5" ry="1" fill="#F1C40F" />
  </g>
</svg>
