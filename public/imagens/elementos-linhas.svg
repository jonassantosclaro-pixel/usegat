<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Outer Pizza Slice Outline -->
  <path d="M 50,5 Q 53,5 57,6 Q 63,8 70,12 C 78,17 84,23 90,32 C 94,38 95,44 95,48 C 95,50 93,52 82,54 L 50,90 L 18,54 C 7,52 5,50 5,48 C 5,44 6,38 10,32 C 16,23 22,17 30,12 Q 37,8 43,6 Q 47,5 50,5 Z" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Outer Crust Detail -->
  <path d="M 50,8 Q 65,11 78,19 C 85,24 89,30 91,37" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" />
  <path d="M 50,8 Q 35,11 22,19 C 15,24 11,30 9,37" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" />

