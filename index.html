<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>USE.GAT - Presentes Personalizados</title>
    
    <!-- PWA Meta tags and Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#4D1D54" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="USE.GAT" />
    <link rel="apple-touch-icon" href="/imagens/logo-gat-purple.png" />
    
    <!-- Preload custom fonts to ensure they load instantly and appear on the bottle design preview -->
    <link rel="preload" href="/fonts/HelloValentica.ttf" as="font" type="font/ttf" crossorigin="anonymous" />
    <link rel="preload" href="/fonts/CreamCake.otf" as="font" type="font/otf" crossorigin="anonymous" />
    <link rel="preload" href="/fonts/BillionMiracles.ttf" as="font" type="font/ttf" crossorigin="anonymous" />
    
    <style>
      @font-face {
        font-family: 'Hello Valentica';
        src: url('/fonts/HelloValentica.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: 'Cream Cake';
        src: url('/fonts/CreamCake.otf') format('opentype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: 'Billion Miracles';
        src: url('/fonts/BillionMiracles.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
